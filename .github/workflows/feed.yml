# Runs the AskAH auction feed on GitHub's machines, so it keeps tracking the
# auction house while your PC is off. Output and tracking state live on the
# "data" branch (replaced every run, no history). Your PC's Sync.ps1 downloads
# from there and uploads your own auctions to the "pc" branch.
#
# GitHub's own schedule (cron) is unreliable and on this repo never started,
# so each run keeps itself going: it does a pass every 20 minutes for about
# five and a half hours, then starts the next run. The cron below is only a
# backup that restarts the chain if it ever breaks. Public repo: no cost.
name: AH feed

on:
  schedule:
    - cron: '8 */3 * * *'
  workflow_dispatch:
    inputs:
      rebuild_static:
        description: 'Re-download all Blizzard game data (items, recipes, quests)'
        type: boolean
        default: false

concurrency:
  group: ah-feed
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ASKAH_CLOUD: '1'
      # sales by hour of day are counted in your time zone
      TZ: ${{ vars.TZ || 'America/New_York' }}
      CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      REGION: ${{ vars.REGION || 'us' }}
      GROUP: ${{ vars.FEED_GROUP }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: main

      - uses: actions/checkout@v5
        with:
          ref: data
          path: data
          fetch-depth: 1

      - name: Check the Blizzard keys
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "Add BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET under Settings > Secrets and variables > Actions"; exit 1
          fi

      - name: Feed passes every 20 minutes
        run: |
          start=$(date +%s)
          rebuild='${{ inputs.rebuild_static }}'
          n=0
          while :; do
            n=$((n+1)); t0=$(date +%s)
            echo "::group::Pass $n ($(date '+%H:%M %Z'))"
            ./main/.github/feed-once.sh "$rebuild" || echo "::warning::Pass $n: the feed reported a problem (see feed.log)"
            echo "::endgroup::"
            rebuild=false
            # stop after ~5h20m so the next run can take over well before the 6h limit
            [ $(( $(date +%s) - start )) -gt 19200 ] && break
            sleep $(( 1200 - ( $(date +%s) - t0 ) % 1200 ))
          done

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run feed.yml --repo "$GITHUB_REPOSITORY" --ref main
